<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thought Dumper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <!-- main Navigation pannel -->
    <nav class="navbar">
        <div class="nav-thoughtdump">
            <div class="thought-dump-logo">
                <img src="images/thought-logo.svg" alt="logo ">
            </div>
            <span class="nav-title">Thought Dumper</span>
        </div>
        
        
        <div class="nav-links">
            <a href="#about">Why to use this website ?</a>
            <a href="#about">Github repo</a>
            <a href="#about">Dump-thought</a>
        </div>
        <button class="nav-btn">Change Theme</button>
        <!-- i think i am going to add the theme changing like dark or white ... -->
    </nav>

    <!-- Thought-writting tab -->
    <div class="main-container">
        <header>
            <h1>Put down your thought</h1>
        </header>
        <div class="your-email">
            <i class="fa-solid fa-envelope"></i> 
            <input type="email" placeholder="Your email please !">
        </div>
        <div class="writting-place">
            <textarea name="thoughts" id="user-thought" placeholder="Write down your thoughts!!"></textarea>
        </div>
        <button class="send-btn">Send</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
